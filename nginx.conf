server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets aggressively
  location ~* \.(?:css|js|mjs|map|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # SPA fallback (anchors still work)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
